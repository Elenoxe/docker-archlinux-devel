name: Publish Docker image

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            cn: "0"
            prefix: ""
            latest: latest
          - variant: cn
            cn: "1"
            prefix: "cn-"
            latest: cn

    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/archlinux-devel
            ghcr.io/${{ github.repository_owner }}/archlinux-devel
          tags: |
            type=raw,value=${{ matrix.latest }},enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD.HHmmss'}},prefix=${{ matrix.prefix }}
            type=sha,prefix=${{ matrix.prefix }}sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          build-args: |
            CN=${{ matrix.cn }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=min
